name: CI

on:
  push:
    paths-ignore:
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      package_version:
        description: Explicit version for a manually dispatched NuGet release.
        required: false
        type: string
        default: ''
      msix_version:
        description: Optional numeric Demo MSIX version; blank uses the CI preview version.
        required: false
        type: string
        default: ''
      store:
        description: Also prepare the Store upload from the same Demo build.
        required: false
        type: boolean
        default: false
    secrets:
      PFX_CERT_BASE64:
        required: false
      PFX_PASSWORD:
        required: false
    outputs:
      package-version:
        value: ${{ jobs.pack-nuget.outputs.package-version }}
      package-artifact:
        value: ${{ jobs.pack-nuget.outputs.package-artifact }}
      sideload-artifact:
        value: ${{ jobs.demo.outputs.sideload_artifact }}
      store-artifact:
        value: ${{ jobs.demo.outputs.store_artifact }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  debug-core:
    uses: ./.github/workflows/debug-core.yml

  pack-nuget:
    name: Pack native packages
    runs-on: windows-2025-vs2026
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      package-artifact: ${{ steps.version.outputs.package-artifact }}

    steps:
      - uses: actions/checkout@v7

      - uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Compute package version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.package_version }}
        run: |
          $version = & ./eng/Get-PackageVersion.ps1 -Kind NuGet -Version $env:REQUESTED_VERSION -RunNumber ${{ github.run_number }} -RunAttempt ${{ github.run_attempt }}
          $artifact = "WinUI-LiquidGlass-$version-attempt-${{ github.run_attempt }}"
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "package-version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package-artifact=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Package version: $version"

      - name: Prepare package output
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts\packages | Out-Null

      - name: Resolve Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$sdk) { throw 'No Windows 10/11 SDK was found on the runner.' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found.' }

          "WIN_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build core and WinUI.LiquidGlass
        shell: pwsh
        run: |
          foreach ($platform in @('x64', 'Win32', 'ARM64')) {
            # LiquidGlass's ProjectReference builds core once for this platform.
            Write-Host "Building WinUI.LiquidGlass Release/$platform"
            & $env:MSBUILD `
              'src\WinUI.LiquidGlass\WinUI.LiquidGlass.vcxproj' `
              /restore `
              /t:Build `
              /p:Configuration=Release `
              "/p:Platform=$platform" `
              /p:NuGetAudit=false `
              "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
              /m /v:minimal /nologo
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Verify generated built-in shader assets
        shell: pwsh
        run: |
          $header = Get-ChildItem 'src\WinUI.Composition.Hlsl\obj\x64\Release' -Recurse -Filter LiquidGlassShader.g.h -ErrorAction SilentlyContinue | Select-Object -First 1
          $dxbc = Get-ChildItem 'src\WinUI.Composition.Hlsl\obj\x64\Release' -Recurse -Filter LiquidGlassShader.dxbc -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$header) { throw 'LiquidGlassShader.g.h was not generated.' }
          if (!$dxbc) { throw 'LiquidGlassShader.dxbc was not generated.' }
          $bytes = [System.IO.File]::ReadAllBytes($dxbc.FullName)
          if ($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'DXBC') {
            throw 'LiquidGlassShader.dxbc is not a DXBC container.'
          }
          Write-Host "Generated: $($dxbc.FullName) ($($dxbc.Length) bytes)"

      - name: Build managed projection package assets
        shell: pwsh
        run: |
          & $env:MSBUILD `
            'projection\WinUI.Composition.Hlsl.Projection.csproj' `
            /restore `
            /t:Build `
            /p:Configuration=Release `
            /p:BuildProjectReferences=false `
            /p:Platform=x64 `
            /p:NuGetAudit=false `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          & $env:MSBUILD `
            'projection\WinUI.LiquidGlass.Projection.csproj' `
            /restore `
            /t:Build `
            /p:Configuration=Release `
            /p:BuildProjectReferences=false `
            /p:Platform=x64 `
            /p:NuGetAudit=false `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Validate native HLSL build integration
        shell: pwsh
        run: |
          $winmd = (Resolve-Path 'artifacts\x64\Release\WinUI.Composition.Hlsl.winmd').Path
          $nativeDll = (Resolve-Path 'artifacts\x64\Release\WinUI.Composition.Hlsl.dll').Path
          $coreShaderDir = (Resolve-Path 'src\WinUI.Composition.Hlsl\obj\x64\Release').Path
          & $env:MSBUILD `
            'tests\BuildIntegration\NativeShaderConsumer.vcxproj' `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            "/p:HlslWinmd=$winmd" `
            "/p:HlslNativeDll=$nativeDll" `
            "/p:HlslCoreShaderDir=$coreShaderDir" `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          $validator = Get-ChildItem 'tests\BuildIntegration\Output' -Recurse -File -Filter 'NativeShaderConsumer.exe' |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]Debug[\\/]' } | Select-Object -First 1
          if (!$validator) { throw 'NativeShaderConsumer executable was not produced.' }
          & $validator.FullName
          if ($LASTEXITCODE) { throw 'Shader export, linkage signature, resource or constant-buffer verification failed.' }

          foreach ($name in @(
            'ConsumerSampler.dxbc',
            'ConsumerMaterializedSampler.dxbc',
            'ConsumerMultiSourceColor.dxbc',
            'ConsumerMultiSourceSampler.dxbc')) {
            $fixture = Get-ChildItem 'tests\BuildIntegration\Output' -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]Hlsl[\\/]' } |
              Select-Object -First 1
            if (!$fixture) { throw "Consumer build target did not emit $name" }
            $bytes = [System.IO.File]::ReadAllBytes($fixture.FullName)
            if ($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'DXBC') {
              throw "$name is not a DXBC container."
            }
          }

      - name: Verify package inputs
        shell: pwsh
        run: |
          $required = @(
            'artifacts\x64\Release\WinUI.Composition.Hlsl.winmd',
            'artifacts\x64\Release\WinUI.Composition.Hlsl.dll',
            'artifacts\Win32\Release\WinUI.Composition.Hlsl.dll',
            'artifacts\ARM64\Release\WinUI.Composition.Hlsl.dll',
            'projection\bin\x64\Release\net8.0-windows10.0.26100.0\WinUI.Composition.Hlsl.Projection.dll',
            'projection\bin\x64\Release\net8.0-windows10.0.26100.0\WinUI.LiquidGlass.Projection.dll',
            'artifacts\x64\Release\WinUI.LiquidGlass\WinUI.LiquidGlass.winmd',
            'artifacts\x64\Release\WinUI.LiquidGlass\WinUI.LiquidGlass.pri',
            'artifacts\x64\Release\WinUI.LiquidGlass\WinUI.LiquidGlass.dll',
            'artifacts\Win32\Release\WinUI.LiquidGlass\WinUI.LiquidGlass.dll',
            'artifacts\ARM64\Release\WinUI.LiquidGlass\WinUI.LiquidGlass.dll'
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing package input: $path" }
            Write-Host "Found: $path"
          }

          # A successful C# build can still produce a 4-KB assembly with no
          # projected WinRT types. Assert on both size and a concrete projected type.
          $projection = Get-Item 'projection\bin\x64\Release\net8.0-windows10.0.26100.0\WinUI.LiquidGlass.Projection.dll'
          if ($projection.Length -lt 16384) {
            throw "WinUI.LiquidGlass.Projection.dll is suspiciously small ($($projection.Length) bytes)."
          }
          $projectionText = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($projection.FullName))
          if (!$projectionText.Contains('LiquidGlassToggleSwitch')) {
            throw 'WinUI.LiquidGlass.Projection.dll does not contain the LiquidGlassToggleSwitch projected type.'
          }

      - name: Pack NuGet packages
        shell: pwsh
        run: |
          & nuget pack `
            'packaging\WinUI.Composition.Hlsl.nuspec' `
            -BasePath . `
            -OutputDirectory 'artifacts\packages' `
            -Version $env:PACKAGE_VERSION `
            -NoPackageAnalysis `
            -Verbosity detailed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          & nuget pack `
            'packaging\WinUI.LiquidGlass.nuspec' `
            -BasePath . `
            -OutputDirectory 'artifacts\packages' `
            -Version $env:PACKAGE_VERSION `
            -Properties "HlslVersion=$env:PACKAGE_VERSION" `
            -NoPackageAnalysis `
            -Verbosity detailed
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          foreach ($id in @('WinUI.Composition.Hlsl', 'WinUI.LiquidGlass')) {
            $expected = "$id.$env:PACKAGE_VERSION.nupkg"
            if (!(Test-Path "artifacts\packages\$expected")) {
              throw "NuGet pack succeeded but $expected was not produced."
            }
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.package-artifact }}
          if-no-files-found: error
          path: artifacts/packages/*.nupkg

  build-csharp-demo:
    name: Build C# package consumers from packed NuGet
    needs: pack-nuget
    runs-on: windows-2025-vs2026
    env:
      PACKAGE_VERSION: ${{ needs.pack-nuget.outputs.package-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare package output
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts\packages | Out-Null

      - name: Download packed NuGets
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.pack-nuget.outputs.package-artifact }}
          path: artifacts/packages

      - name: Configure exact package consumers
        shell: pwsh
        run: |
          & ./eng/Use-CIPackages.ps1 -PackageVersion $env:PACKAGE_VERSION

          $projectPath = (Resolve-Path 'tests\CSharp\HlslCSharpConsumer.csproj').Path
          [xml]$project = Get-Content $projectPath -Raw
          $packageRef = $project.Project.ItemGroup.PackageReference | Where-Object { $_.Include -eq 'WinUI.Composition.Hlsl' } | Select-Object -First 1
          if (!$packageRef) { throw 'WinUI.Composition.Hlsl PackageReference was not found in the C# demo.' }
          $packageRef.SetAttribute('VersionOverride', $env:PACKAGE_VERSION)
          $project.Save($projectPath)

      - name: Resolve Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$sdk) { throw 'Windows SDK not found.' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild not found.' }
          "WIN_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build managed demo from package
        shell: pwsh
        run: |
          & $env:MSBUILD `
            'tests\CSharp\HlslCSharpConsumer.csproj' `
            /restore /t:Build `
            /p:Configuration=Debug /p:Platform=x64 /p:NuGetAudit=false `
            /p:GenerateAppxPackageOnBuild=false `
            "/p:RestoreConfigFile=$((Resolve-Path 'NuGet.CI.Config').Path)" `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build managed LiquidGlass consumer from package
        shell: pwsh
        run: |
          & $env:MSBUILD `
            'tests\CSharp\LiquidGlassConsumer\LiquidGlassConsumer.csproj' `
            /restore /t:Build `
            /p:Configuration=Debug /p:Platform=x64 /p:NuGetAudit=false `
            /p:GenerateAppxPackageOnBuild=false `
            "/p:LiquidGlassPackageVersion=$env:PACKAGE_VERSION" `
            "/p:RestoreConfigFile=$((Resolve-Path 'NuGet.CI.Config').Path)" `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify managed HLSL build outputs
        shell: pwsh
        run: |
          foreach ($name in @(
            'ConsumerColor.dxbc',
            'ConsumerMaterializedSampler.dxbc',
            'ConsumerMultiSourceColor.dxbc',
            'ConsumerMultiSourceSampler.dxbc')) {
            $fixture = Get-ChildItem 'tests\CSharp' -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]Hlsl[\\/]' } |
              Select-Object -First 1
            if (!$fixture) { throw "Managed build target did not emit $name" }
            $bytes = [System.IO.File]::ReadAllBytes($fixture.FullName)
            if ($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'DXBC') {
              throw "$name is not a DXBC container."
            }
          }

  demo:
    name: Package Demo from validated NuGets
    needs: [pack-nuget, build-csharp-demo, debug-core]
    if: ${{ !cancelled() && needs.pack-nuget.result == 'success' }}
    uses: ./.github/workflows/demo-packages.yml
    with:
      package_version: ${{ needs.pack-nuget.outputs.package-version }}
      package_artifact: ${{ needs.pack-nuget.outputs.package-artifact }}
      msix_version: ${{ inputs.msix_version || '' }}
      store: ${{ inputs.store || false }}
    secrets:
      PFX_CERT_BASE64: ${{ secrets.PFX_CERT_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
