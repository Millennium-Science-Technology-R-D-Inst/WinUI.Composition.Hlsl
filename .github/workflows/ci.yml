name: CI

on:
  push:
    branches: [ master ]
    paths-ignore: [ '.gitattributes', '.gitignore', '.gitmodules', '**.md', 'LICENSE' ]
  pull_request:
    branches: [ master ]
    paths-ignore: [ '.gitattributes', '.gitignore', '.gitmodules', '**.md', 'LICENSE' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-nuget:
    name: Pack native packages
    runs-on: windows-2025-vs2026
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      package-artifact: ${{ steps.version.outputs.package-artifact }}
    steps:
      - uses: actions/checkout@v7
      - uses: NuGet/setup-nuget@v4
        with: { nuget-version: latest }
      - name: Compute package version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $artifact = "WinUI-LiquidGlass-$version-attempt-${{ github.run_attempt }}"
          "PACKAGE_VERSION=$version" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "package-version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package-artifact=$artifact" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Resolve build tools
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Directory | Where-Object Name -Match '^10\.0\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$sdk) { throw 'Windows SDK not found.' }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'MSBuild not found.' }
          "WIN_SDK=$($sdk.Name)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build core and WinUI.LiquidGlass
        shell: pwsh
        run: |
          foreach ($platform in @('x64','Win32','ARM64')) {
            & $env:MSBUILD 'src\WinUI.Composition.Hlsl\WinUI.Composition.Hlsl.vcxproj' /restore /t:Build /p:Configuration=Release "/p:Platform=$platform" /p:NuGetAudit=false "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" /m /v:minimal /nologo
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $env:MSBUILD 'src\WinUI.LiquidGlass\WinUI.LiquidGlass.vcxproj' /restore /t:Build /p:Configuration=Release "/p:Platform=$platform" /p:NuGetAudit=false "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" /m /v:minimal /nologo
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Verify built-in shader assets
        shell: pwsh
        run: |
          $header = Get-ChildItem 'src\WinUI.Composition.Hlsl\obj\x64\Release' -Recurse -Filter LiquidGlassShader.g.h -ErrorAction SilentlyContinue | Select-Object -First 1
          $dxbc = Get-ChildItem 'src\WinUI.Composition.Hlsl\obj\x64\Release' -Recurse -Filter LiquidGlassShader.dxbc -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$header -or !$dxbc) { throw 'Built-in LiquidGlass shader assets were not generated.' }
      - name: Build projection
        shell: pwsh
        run: |
          & $env:MSBUILD 'projection\WinUI.Composition.Hlsl.Projection.csproj' /restore /t:Build /p:Configuration=Release /p:Platform=x64 /p:NuGetAudit=false "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Pack packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts\packages | Out-Null
          & nuget pack 'packaging\WinUI.Composition.Hlsl.nuspec' -BasePath . -OutputDirectory artifacts\packages -Version $env:PACKAGE_VERSION -NoPackageAnalysis
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & nuget pack 'packaging\WinUI.LiquidGlass.nuspec' -BasePath . -OutputDirectory artifacts\packages -Version $env:PACKAGE_VERSION -Properties "HlslVersion=$env:PACKAGE_VERSION" -NoPackageAnalysis
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($id in @('WinUI.Composition.Hlsl','WinUI.LiquidGlass')) {
            if (!(Test-Path "artifacts\packages\$id.$env:PACKAGE_VERSION.nupkg")) { throw "Missing package: $id" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.package-artifact }}
          if-no-files-found: error
          path: artifacts/packages/*.nupkg

  build-cpp-xaml-demo:
    name: Build C++ demo from WinUI.LiquidGlass package
    needs: pack-nuget
    runs-on: windows-2025-vs2026
    env: { PACKAGE_VERSION: '${{ needs.pack-nuget.outputs.package-version }}' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: '${{ needs.pack-nuget.outputs.package-artifact }}', path: artifacts/packages }
      - name: Configure package consumer
        shell: pwsh
        run: |
          $projectPath = (Resolve-Path 'tests\Cpp\WUILiquidGlassDemo.Hlsl.vcxproj').Path
          [xml]$project = Get-Content $projectPath -Raw
          $ns = [System.Xml.XmlNamespaceManager]::new($project.NameTable); $ns.AddNamespace('m','http://schemas.microsoft.com/developer/msbuild/2003')
          @($project.SelectNodes('//m:ProjectReference',$ns)) | ForEach-Object { [void]$_.ParentNode.RemoveChild($_) }
          $group = $project.CreateElement('ItemGroup',$project.DocumentElement.NamespaceURI)
          $ref = $project.CreateElement('PackageReference',$project.DocumentElement.NamespaceURI); $ref.SetAttribute('Include','WinUI.LiquidGlass'); $ref.SetAttribute('VersionOverride',$env:PACKAGE_VERSION); [void]$group.AppendChild($ref); [void]$project.DocumentElement.AppendChild($group); $project.Save($projectPath)
          @'<?xml version="1.0"?><configuration><packageSources><clear/><add key="local" value="artifacts/packages"/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources></configuration>'@ | Set-Content NuGet.CI.Config
      - name: Build demo
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild 'tests\Cpp\WUILiquidGlassDemo.Hlsl.vcxproj' /restore /t:Build /p:Configuration=Debug /p:Platform=x64 /p:NuGetAudit=false "/p:RestoreConfigFile=$((Resolve-Path 'NuGet.CI.Config').Path)" /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  build-csharp-demo:
    name: Build C# core demo
    needs: pack-nuget
    runs-on: windows-2025-vs2026
    env: { PACKAGE_VERSION: '${{ needs.pack-nuget.outputs.package-version }}' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: '${{ needs.pack-nuget.outputs.package-artifact }}', path: artifacts/packages }
      - name: Build managed demo
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"; $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild 'tests\CSharp\HlslCSharpConsumer.csproj' /restore /t:Build /p:Configuration=Debug /p:Platform=x64 /p:NuGetAudit=false /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  publish-nuget:
    name: Publish NuGet
    needs: [ pack-nuget, build-cpp-xaml-demo, build-csharp-demo ]
    if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions: { contents: read, id-token: write }
    runs-on: ubuntu-latest
    env: { PACKAGE_VERSION: '${{ needs.pack-nuget.outputs.package-version }}' }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: '${{ needs.pack-nuget.outputs.package-artifact }}', path: artifacts/packages }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '10.0.x' }
      - uses: NuGet/login@v1
        id: nuget-login
        with: { user: '${{ secrets.NUGET_USER }}' }
      - name: Publish packages
        shell: bash
        run: |
          for id in WinUI.Composition.Hlsl WinUI.LiquidGlass; do
            dotnet nuget push "artifacts/packages/${id}.${PACKAGE_VERSION}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
          done
