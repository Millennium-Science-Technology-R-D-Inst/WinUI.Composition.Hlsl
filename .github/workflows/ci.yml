name: CI

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.gitattributes'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack-nuget:
    name: Pack NuGet
    runs-on: windows-2025-vs2026
    outputs:
      package-version: ${{ steps.version.outputs.package-version }}
      package-artifact: ${{ steps.version.outputs.package-artifact }}

    steps:
      - uses: actions/checkout@v7

      - uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Compute package version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $artifact = "WinUI.Composition.Hlsl-$version-attempt-${{ github.run_attempt }}"
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "package-version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "package-artifact=$artifact" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Package version: $version"
          Write-Host "Package artifact: $artifact"

      - name: Prepare package output
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts\packages | Out-Null

      - name: Resolve Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$sdk) { throw 'No Windows 10/11 SDK was found on the runner.' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found.' }

          "WIN_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Windows SDK: $($sdk.Name)"
          Write-Host "MSBuild: $msbuild"

      - name: Build native core and controls
        shell: pwsh
        run: |
          foreach ($platform in @('x64', 'Win32', 'ARM64')) {
            Write-Host "Building core Release/$platform"
            & $env:MSBUILD `
              'src\WinUI.Composition.Hlsl\WinUI.Composition.Hlsl.vcxproj' `
              /restore `
              /t:Build `
              /p:Configuration=Release `
              "/p:Platform=$platform" `
              /p:NuGetAudit=false `
              "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
              /m /v:minimal /nologo `
              /fl "/flp:logfile=native-$platform.log;verbosity=minimal"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }

            Write-Host "Building controls Release/$platform"
            & $env:MSBUILD `
              'src\WinUI.Composition.Hlsl.Controls\WinUI.Composition.Hlsl.Controls.vcxproj' `
              /restore `
              /t:Build `
              /p:Configuration=Release `
              "/p:Platform=$platform" `
              /p:NuGetAudit=false `
              "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
              /m /v:minimal /nologo `
              /fl "/flp:logfile=controls-$platform.log;verbosity=minimal"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Verify generated built-in shader assets
        shell: pwsh
        run: |
          $header = Get-ChildItem 'src\WinUI.Composition.Hlsl\obj\x64\Release' -Recurse -Filter LiquidGlassShader.g.h -ErrorAction SilentlyContinue | Select-Object -First 1
          $dxbc = Get-ChildItem 'src\WinUI.Composition.Hlsl\obj\x64\Release' -Recurse -Filter LiquidGlassShader.dxbc -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$header) { throw 'LiquidGlassShader.g.h was not generated.' }
          if (!$dxbc) { throw 'LiquidGlassShader.dxbc was not generated.' }
          Write-Host "Generated header: $($header.FullName)"
          Write-Host "Generated DXBC: $($dxbc.FullName) ($($dxbc.Length) bytes)"

      - name: Build projection package asset
        shell: pwsh
        run: |
          & $env:MSBUILD `
            'projection\WinUI.Composition.Hlsl.Projection.csproj' `
            /restore `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:NuGetAudit=false `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo `
            /fl "/flp:logfile=projection-build.log;verbosity=minimal"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Validate native HLSL build integration
        shell: pwsh
        run: |
          $winmd = (Resolve-Path 'artifacts\x64\Release\WinUI.Composition.Hlsl.winmd').Path
          $nativeDll = (Resolve-Path 'artifacts\x64\Release\WinUI.Composition.Hlsl.dll').Path
          & $env:MSBUILD `
            'tests\BuildIntegration\NativeShaderConsumer.vcxproj' `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            "/p:HlslWinmd=$winmd" `
            "/p:HlslNativeDll=$nativeDll" `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo `
            /fl "/flp:logfile=native-shader-consumer.log;verbosity=minimal"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          foreach ($name in @(
            'ConsumerSampler.dxbc',
            'ConsumerMaterializedSampler.dxbc',
            'ConsumerMultiSourceColor.dxbc',
            'ConsumerMultiSourceSampler.dxbc')) {
            $fixture = Get-ChildItem 'tests\BuildIntegration\Output' -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]Hlsl[\\/]' } |
              Select-Object -First 1
            if (!$fixture) { throw "Consumer build target did not emit $name" }
            $bytes = [System.IO.File]::ReadAllBytes($fixture.FullName)
            if ($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'DXBC') {
              throw "$name is not a DXBC container."
            }
            Write-Host "Verified $($fixture.FullName) ($($fixture.Length) bytes)"
          }

      - name: Verify package inputs
        shell: pwsh
        run: |
          $required = @(
            'artifacts\x64\Release\WinUI.Composition.Hlsl.winmd',
            'artifacts\x64\Release\WinUI.Composition.Hlsl.dll',
            'artifacts\Win32\Release\WinUI.Composition.Hlsl.dll',
            'artifacts\ARM64\Release\WinUI.Composition.Hlsl.dll',
            'projection\bin\x64\Release\net8.0-windows10.0.26100.0\WinUI.Composition.Hlsl.Projection.dll',
            'artifacts\x64\Release\WinUI.Composition.Hlsl.Controls\WinUI.Composition.Hlsl.Controls.winmd',
            'artifacts\x64\Release\WinUI.Composition.Hlsl.Controls\WinUI.Composition.Hlsl.Controls.pri',
            'artifacts\x64\Release\WinUI.Composition.Hlsl.Controls\WinUI.Composition.Hlsl.Controls.dll',
            'artifacts\Win32\Release\WinUI.Composition.Hlsl.Controls\WinUI.Composition.Hlsl.Controls.dll',
            'artifacts\ARM64\Release\WinUI.Composition.Hlsl.Controls\WinUI.Composition.Hlsl.Controls.dll'
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing package input: $path" }
            Write-Host "Found: $path"
          }

      - name: Pack NuGet
        shell: pwsh
        run: |
          & nuget pack `
            'packaging\WinUI.Composition.Hlsl.nuspec' `
            -BasePath . `
            -OutputDirectory 'artifacts\packages' `
            -Version $env:PACKAGE_VERSION `
            -NoPackageAnalysis `
            -Verbosity detailed 2>&1 | Tee-Object -FilePath nuget-pack.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          & nuget pack `
            'packaging\WinUI.Composition.Hlsl.Controls.nuspec' `
            -BasePath . `
            -OutputDirectory 'artifacts\packages' `
            -Version $env:PACKAGE_VERSION `
            -Properties "HlslVersion=$env:PACKAGE_VERSION" `
            -NoPackageAnalysis `
            -Verbosity detailed 2>&1 | Tee-Object -FilePath controls-nuget-pack.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          foreach ($id in @('WinUI.Composition.Hlsl', 'WinUI.Composition.Hlsl.Controls')) {
            $expected = "$id.$env:PACKAGE_VERSION.nupkg"
            $package = Get-ChildItem 'artifacts\packages' -Filter $expected -File | Select-Object -First 1
            if (!$package) { throw "NuGet pack succeeded but $expected was not produced." }
            Write-Host "Package: $($package.FullName)"
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.package-artifact }}
          if-no-files-found: error
          path: artifacts/packages/WinUI.Composition.Hlsl*.nupkg

      - name: Upload pack logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WinUI.Composition.Hlsl-pack-logs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            native-*.log
            controls-*.log
            projection-build.log
            native-shader-consumer.log
            nuget-pack.log
            controls-nuget-pack.log

  build-cpp-xaml-demo:
    name: Build C++ XAML demo from packed Controls NuGet
    needs: pack-nuget
    runs-on: windows-2025-vs2026
    env:
      PACKAGE_VERSION: ${{ needs.pack-nuget.outputs.package-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare local NuGet source
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts\packages | Out-Null

      - name: Download packed NuGet
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.pack-nuget.outputs.package-artifact }}
          path: artifacts/packages

      - name: Configure exact Controls package consumer
        shell: pwsh
        run: |
          foreach ($id in @('WinUI.Composition.Hlsl', 'WinUI.Composition.Hlsl.Controls')) {
            $expected = "$id.$env:PACKAGE_VERSION.nupkg"
            if (!(Test-Path "artifacts\packages\$expected")) { throw "Expected package $expected was not downloaded." }
          }

          $projectPath = (Resolve-Path 'tests\Cpp\WUILiquidGlassDemo.Hlsl.vcxproj').Path
          [xml]$project = Get-Content $projectPath -Raw
          $ns = [System.Xml.XmlNamespaceManager]::new($project.NameTable)
          $ns.AddNamespace('msb', 'http://schemas.microsoft.com/developer/msbuild/2003')
          $projectRefs = @($project.SelectNodes('//msb:ProjectReference[contains(@Include, "WinUI.Composition.Hlsl")]', $ns))
          if ($projectRefs.Count -lt 2) { throw 'Expected core and Controls ProjectReference entries in the C++ demo.' }
          foreach ($projectRef in $projectRefs) {
            [void]$projectRef.ParentNode.RemoveChild($projectRef)
          }
          $itemGroup = $project.CreateElement('ItemGroup', $project.DocumentElement.NamespaceURI)
          $packageRef = $project.CreateElement('PackageReference', $project.DocumentElement.NamespaceURI)
          $packageRef.SetAttribute('Include', 'WinUI.Composition.Hlsl.Controls')
          $packageRef.SetAttribute('VersionOverride', $env:PACKAGE_VERSION)
          [void]$itemGroup.AppendChild($packageRef)
          [void]$project.DocumentElement.AppendChild($itemGroup)
          $project.Save($projectPath)

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="LocalHlsl" value="artifacts/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          '@ | Set-Content -Path NuGet.CI.Config -Encoding utf8

      - name: Resolve Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$sdk) { throw 'No Windows 10/11 SDK was found on the runner.' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found.' }

          "WIN_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build demo from Controls NuGet
        shell: pwsh
        run: |
          & $env:MSBUILD `
            'tests\Cpp\WUILiquidGlassDemo.Hlsl.vcxproj' `
            /restore `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:NuGetAudit=false `
            "/p:RestoreConfigFile=$((Resolve-Path 'NuGet.CI.Config').Path)" `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo `
            /fl "/flp:logfile=Cpp-test-build.log;verbosity=minimal"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload C++ demo build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-xaml-demo-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            Cpp-test-build.log
            tests/Cpp/Output/**/*.log

  build-csharp-demo:
    name: Build C# demo from packed NuGet
    needs: pack-nuget
    runs-on: windows-2025-vs2026
    env:
      PACKAGE_VERSION: ${{ needs.pack-nuget.outputs.package-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Prepare local NuGet source
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts\packages | Out-Null

      - name: Download packed NuGet
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.pack-nuget.outputs.package-artifact }}
          path: artifacts/packages

      - name: Configure exact managed package consumer
        shell: pwsh
        run: |
          $expected = "WinUI.Composition.Hlsl.$env:PACKAGE_VERSION.nupkg"
          if (!(Test-Path "artifacts\packages\$expected")) { throw "Expected package $expected was not downloaded." }

          $projectPath = (Resolve-Path 'tests\CSharp\HlslCSharpConsumer.csproj').Path
          [xml]$project = Get-Content $projectPath -Raw
          $packageRef = $project.Project.ItemGroup.PackageReference | Where-Object { $_.Include -eq 'WinUI.Composition.Hlsl' } | Select-Object -First 1
          if (!$packageRef) { throw 'WinUI.Composition.Hlsl PackageReference was not found in the C# demo.' }
          $packageRef.SetAttribute('VersionOverride', $env:PACKAGE_VERSION)
          $project.Save($projectPath)

          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="LocalHlsl" value="artifacts/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          '@ | Set-Content -Path NuGet.CI.Config -Encoding utf8

      - name: Resolve Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$sdk) { throw 'No Windows 10/11 SDK was found on the runner.' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found.' }

          "WIN_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build managed demo from packed NuGet
        shell: pwsh
        run: |
          & $env:MSBUILD `
            'tests\CSharp\HlslCSharpConsumer.csproj' `
            /restore `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:NuGetAudit=false `
            "/p:RestoreConfigFile=$((Resolve-Path 'NuGet.CI.Config').Path)" `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo `
            /fl "/flp:logfile=CSharp-test-build.log;verbosity=minimal"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify managed HLSL build outputs
        shell: pwsh
        run: |
          foreach ($name in @(
            'ConsumerColor.dxbc',
            'ConsumerMaterializedSampler.dxbc',
            'ConsumerMultiSourceColor.dxbc',
            'ConsumerMultiSourceSampler.dxbc')) {
            $fixture = Get-ChildItem 'tests\CSharp' -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]Hlsl[\\/]' } |
              Select-Object -First 1
            if (!$fixture) { throw "Managed build target did not emit $name" }
            $bytes = [System.IO.File]::ReadAllBytes($fixture.FullName)
            if ($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'DXBC') {
              throw "$name is not a DXBC container."
            }
            Write-Host "Verified $($fixture.FullName) ($($fixture.Length) bytes)"
          }

      - name: Upload C# demo build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: csharp-demo-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: CSharp-test-build.log

  publish-nuget:
    name: Publish NuGet
    needs:
      - pack-nuget
      - build-cpp-xaml-demo
      - build-csharp-demo
    if: >-
      success() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.pack-nuget.outputs.package-version }}

    steps:
      - name: Download validated NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.pack-nuget.outputs.package-artifact }}
          path: artifacts/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify packages
        shell: bash
        run: |
          core="artifacts/packages/WinUI.Composition.Hlsl.${PACKAGE_VERSION}.nupkg"
          controls="artifacts/packages/WinUI.Composition.Hlsl.Controls.${PACKAGE_VERSION}.nupkg"
          for package in "$core" "$controls"; do
            if [[ ! -f "$package" ]]; then
              echo "::error::Expected package not found: $package"
              exit 1
            fi
          done
          echo "CORE_PACKAGE_PATH=$core" >> "$GITHUB_ENV"
          echo "CONTROLS_PACKAGE_PATH=$controls" >> "$GITHUB_ENV"

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish core to NuGet.org
        shell: bash
        run: |
          dotnet nuget push "$CORE_PACKAGE_PATH" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Publish controls to NuGet.org
        shell: bash
        run: |
          dotnet nuget push "$CONTROLS_PACKAGE_PATH" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
