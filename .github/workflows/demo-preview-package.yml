name: Demo Preview Package

# Manual convenience entry; branch push previews are produced by CI itself.
on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Optional sideload version (Major.Minor.Build.Revision); blank uses YYYY.MMDD.RUN.0.
        required: false
        type: string

permissions:
  contents: read

jobs:
  preview:
    uses: ./.github/workflows/ci.yml
    with:
      msix_version: ${{ inputs.package_version || '' }}
    secrets:
      PFX_CERT_BASE64: ${{ secrets.PFX_CERT_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
