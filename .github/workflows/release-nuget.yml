name: Release

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Release version, e.g. 1.2.0 or 1.2.0.1 (optional NuGet prerelease suffix).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      msix-version: ${{ steps.version.outputs.msix-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate explicit release version
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.package_version }}
        run: |
          $version = & ./eng/Get-PackageVersion.ps1 -Kind NuGet -Version $env:REQUESTED_VERSION -RequireExplicit
          $numericVersion = ($version -split '[-+]', 2)[0]
          $msixVersion = & ./eng/Get-PackageVersion.ps1 -Kind Store -Version $numericVersion -RequireExplicit
          "version=$version" >> $env:GITHUB_OUTPUT
          "msix-version=$msixVersion" >> $env:GITHUB_OUTPUT

  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      package_version: ${{ needs.version.outputs.version }}
      msix_version: ${{ needs.version.outputs.msix-version }}
      store: true
    secrets:
      PFX_CERT_BASE64: ${{ secrets.PFX_CERT_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}

  publish:
    name: Publish NuGet and Store release
    needs: validate
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.package-version }}

    steps:
      - name: Download validated NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.validate.outputs.package-artifact }}
          path: artifacts/packages

      - name: Download Store upload from the same source revision
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.validate.outputs.store-artifact }}
          path: artifacts/store

      - name: Download signed sideload packages and public certificate
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.validate.outputs.sideload-artifact }}
          path: artifacts/sideload

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify packages
        shell: bash
        run: |
          for id in WinUI.Composition.Hlsl WinUI.LiquidGlass; do
            package="artifacts/packages/${id}.${PACKAGE_VERSION}.nupkg"
            if [[ ! -f "$package" ]]; then
              echo "::error::Expected package not found: $package"
              exit 1
            fi
          done

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        shell: bash
        run: |
          for id in WinUI.Composition.Hlsl WinUI.LiquidGlass; do
            dotnet nuget push "artifacts/packages/${id}.${PACKAGE_VERSION}.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          done

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.PACKAGE_VERSION }}
          name: ${{ env.PACKAGE_VERSION }} Release
          commit: ${{ github.sha }}
          artifacts: artifacts/packages/*.nupkg,artifacts/store/*.msixupload,artifacts/sideload/**/*.msix,artifacts/sideload/**/*.cer
          artifactErrorsFailBuild: true
          allowUpdates: false
          prerelease: ${{ contains(env.PACKAGE_VERSION, '-') }}
          generateReleaseNotes: true
          body: |
            Release version: ${{ env.PACKAGE_VERSION }}
            Packages: WinUI.Composition.Hlsl and WinUI.LiquidGlass.
            Source: ${{ github.sha }}
            Both NuGet packages, the unsigned Store upload and signed x64/ARM64 sideload packages are built from this revision.
            Upload the .msixupload to Partner Center; it already contains the x64/ARM64 bundle.
            For sideload installation, trust the attached organization public certificate (LiquidGlassDemo.cer) if needed.
