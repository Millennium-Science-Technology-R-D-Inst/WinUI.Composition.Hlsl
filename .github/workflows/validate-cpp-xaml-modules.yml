name: Validate C++ demo and package

on:
  push:
    branches:
      - 'fix/**'
    paths:
      - .github/workflows/validate-cpp-xaml-modules.yml
      - Directory.Packages.props
      - NuGet.Config
      - projection/**
      - packaging/**
      - src/**
      - tests/Cpp/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack-nuget:
    name: Pack NuGet package
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Prepare package output
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts\packages | Out-Null

      - name: Resolve Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$sdk) { throw 'No Windows 10/11 SDK was found on the runner.' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found.' }

          "WIN_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Windows SDK: $($sdk.Name)"
          Write-Host "MSBuild: $msbuild"

      - name: Build native package assets
        shell: pwsh
        run: |
          # Do these as top-level MSBuild invocations. With the nested MSBuild calls
          # inside the Pack target, WinAppSDK Foundation was evaluated with an empty
          # $(Platform) on the hosted runner and produced lib\native\ instead of
          # lib\native\x86 for Win32.
          foreach ($platform in @('x64', 'Win32', 'ARM64')) {
            Write-Host "Building native Release/$platform"
            & $env:MSBUILD `
              'src\WinUI.Composition.Hlsl\WinUI.Composition.Hlsl.vcxproj' `
              /restore `
              /t:Build `
              /p:Configuration=Release `
              "/p:Platform=$platform" `
              /p:NuGetAudit=false `
              "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
              /m /v:minimal /nologo `
              /fl "/flp:logfile=native-$platform.log;verbosity=minimal"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Build projection package asset
        shell: pwsh
        run: |
          & $env:MSBUILD `
            'projection\WinUI.Composition.Hlsl.Projection.csproj' `
            /restore `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:NuGetAudit=false `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo `
            /fl "/flp:logfile=projection-build.log;verbosity=minimal"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify package inputs
        shell: pwsh
        run: |
          $required = @(
            'artifacts\x64\Release\WinUI.Composition.Hlsl.winmd',
            'artifacts\x64\Release\WinUI.Composition.Hlsl.dll',
            'artifacts\Win32\Release\WinUI.Composition.Hlsl.dll',
            'artifacts\ARM64\Release\WinUI.Composition.Hlsl.dll',
            'projection\bin\x64\Release\net8.0-windows10.0.26100.0\WinUI.Composition.Hlsl.Projection.dll'
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing package input: $path" }
            Write-Host "Found: $path"
          }

      - name: Pack NuGet from nuspec
        shell: pwsh
        run: |
          & nuget pack `
            'packaging\WinUI.Composition.Hlsl.nuspec' `
            -BasePath . `
            -OutputDirectory 'artifacts\packages' `
            -NoPackageAnalysis `
            -Verbosity detailed 2>&1 | Tee-Object -FilePath nuget-pack.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          $packages = Get-ChildItem 'artifacts\packages' -Filter 'WinUI.Composition.Hlsl.0.1.0-preview.8.nupkg' -File
          if (!$packages) { throw 'NuGet pack succeeded but the expected .nupkg was not produced.' }
          $packages | ForEach-Object { Write-Host "Package: $($_.FullName)" }

      - name: Upload NuGet package
        uses: actions/upload-artifact@v7
        with:
          name: WinUI.Composition.Hlsl-nupkg
          if-no-files-found: error
          path: artifacts/packages/WinUI.Composition.Hlsl.0.1.0-preview.8.nupkg

      - name: Upload pack logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: WinUI.Composition.Hlsl-pack-logs
          if-no-files-found: ignore
          path: |
            native-*.log
            projection-build.log
            nuget-pack.log

  build-cpp-xaml-demo:
    name: Build C++ XAML demo from packed NuGet
    needs: pack-nuget
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - name: Prepare local NuGet source
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts\packages | Out-Null

      - name: Download packed NuGet
        uses: actions/download-artifact@v8
        with:
          name: WinUI.Composition.Hlsl-nupkg
          path: artifacts/packages

      - name: Verify packed NuGet
        shell: pwsh
        run: |
          $package = Get-ChildItem 'artifacts\packages' -Filter 'WinUI.Composition.Hlsl.0.1.0-preview.8.nupkg' -File | Select-Object -First 1
          if (!$package) {
            Get-ChildItem 'artifacts\packages' -Recurse | Format-Table FullName
            throw 'Expected WinUI.Composition.Hlsl 0.1.0-preview.8 package was not downloaded.'
          }
          Write-Host "Consumer package: $($package.FullName)"

          # Force this package ID to resolve only from the package produced by the previous job.
          # All external dependencies for this native consumer are Microsoft.* or YexuanXiao.*.
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="LocalHlsl" value="artifacts/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="LocalHlsl">
                <package pattern="WinUI.Composition.Hlsl" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="Microsoft.*" />
                <package pattern="YexuanXiao.*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          '@ | Set-Content -Path NuGet.CI.Config -Encoding utf8

      - name: Resolve Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$sdk) { throw 'No Windows 10/11 SDK was found on the runner.' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found.' }

          "WIN_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Windows SDK: $($sdk.Name)"
          Write-Host "MSBuild: $msbuild"

      - name: Build demo from packed NuGet
        shell: pwsh
        run: |
          & $env:MSBUILD `
            'tests\Cpp\WUILiquidGlassDemo.Hlsl.vcxproj' `
            /restore `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:NuGetAudit=false `
            "/p:RestoreConfigFile=$((Resolve-Path 'NuGet.CI.Config').Path)" `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo `
            /fl "/flp:logfile=Cpp-test-build.log;verbosity=minimal"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload demo build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpp-xaml-demo-build-logs
          if-no-files-found: ignore
          path: |
            Cpp-test-build.log
            tests/Cpp/Output/**/*.log
