name: Validate C++ XAML modules

on:
  push:
    branches:
      - 'fix/**'
    paths:
      - .github/workflows/validate-cpp-xaml-modules.yml
      - Directory.Packages.props
      - src/**
      - tests/Cpp/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cpp-xaml-demo:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - name: Prepare local NuGet source
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts\packages | Out-Null

      - name: Resolve Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$sdk) { throw 'No Windows 10/11 SDK was found on the runner.' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found.' }

          "WIN_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Windows SDK: $($sdk.Name)"
          Write-Host "MSBuild: $msbuild"

      - name: Point demo at source project
        shell: pwsh
        run: |
          # Packaging is validated separately. This workflow exists specifically to
          # compile the modularized C++/WinRT XAML demo, so do not let nupkg creation
          # prevent the consumer project from reaching ClCompile.
          $path = 'tests\Cpp\WUILiquidGlassDemo.Hlsl.vcxproj'
          $text = Get-Content $path -Raw
          $old = '<PackageReference Include="WinUI.Composition.Hlsl" />'
          $new = '<ProjectReference Include="..\..\src\WinUI.Composition.Hlsl\WinUI.Composition.Hlsl.vcxproj" />'
          if (!$text.Contains($old)) { throw 'Expected WinUI.Composition.Hlsl PackageReference was not found.' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding utf8

      - name: Build C++ XAML demo
        shell: pwsh
        run: |
          & $env:MSBUILD `
            'tests\Cpp\WUILiquidGlassDemo.Hlsl.vcxproj' `
            /restore `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:NuGetAudit=false `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo `
            /fl "/flp:logfile=Cpp-test-build.log;verbosity=minimal"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-xaml-module-build-logs
          if-no-files-found: ignore
          path: |
            Cpp-test-build.log
            tests/Cpp/Output/**/*.log
