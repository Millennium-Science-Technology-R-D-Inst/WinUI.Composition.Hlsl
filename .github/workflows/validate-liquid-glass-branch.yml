name: Validate liquid glass branch

on:
  push:
    branches:
      - fix/liquid-glass-topology-blur-precompiled-hlsl
    paths:
      - .github/workflows/validate-liquid-glass-branch.yml
      - src/WinUI.Composition.Hlsl/WinUI.Composition.Hlsl.vcxproj
      - src/WinUI.Composition.Hlsl/Shaders/**
      - src/WinUI.Composition.Hlsl/Materials/**
      - src/WinUI.Composition.Hlsl/Public/**
      - src/WinUI.Composition.Hlsl/Runtime/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare local NuGet source
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts\packages | Out-Null
      - name: Build native x64 Debug with installed SDK
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$sdk) { throw 'No Windows 10/11 SDK was found on the runner.' }
          Write-Host "Compile-only CI retarget: $($sdk.Name)"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found.' }

          & $msbuild `
            'src\WinUI.Composition.Hlsl\WinUI.Composition.Hlsl.vcxproj' `
            /restore `
            /p:NuGetAudit=false `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            "/p:WindowsTargetPlatformVersion=$($sdk.Name)" `
            /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify generated shader assets
        shell: pwsh
        run: |
          $header = Get-ChildItem -Recurse -Filter LiquidGlassShader.g.h | Select-Object -First 1
          $dxbc = Get-ChildItem -Recurse -Filter LiquidGlassShader.dxbc | Select-Object -First 1
          if (!$header) { throw 'LiquidGlassShader.g.h was not generated.' }
          if (!$dxbc) { throw 'LiquidGlassShader.dxbc was not generated.' }
          Write-Host "Generated header: $($header.FullName)"
          Write-Host "Generated DXBC: $($dxbc.FullName) ($($dxbc.Length) bytes)"
