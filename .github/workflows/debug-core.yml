name: Debug Core

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-core-debug:
    name: Build core Debug/x64
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v7

      - name: Resolve Visual Studio and Windows SDK
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$sdk) { throw 'No Windows 10/11 SDK was found on the runner.' }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found.' }

          "WIN_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build core Debug/x64
        shell: pwsh
        run: |
          & $env:MSBUILD `
            'src\WinUI.Composition.Hlsl\WinUI.Composition.Hlsl.vcxproj' `
            /restore `
            /t:Build `
            /p:Configuration=Debug `
            /p:Platform=x64 `
            /p:NuGetAudit=false `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" `
            /m /v:minimal /nologo `
            /fl "/flp:logfile=core-x64-debug.log;verbosity=minimal"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify Debug built-in shader asset
        shell: pwsh
        run: |
          $dxbc = Get-ChildItem 'src\WinUI.Composition.Hlsl\obj\x64\Debug' -Recurse -Filter LiquidGlassShader.dxbc -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$dxbc) { throw 'Debug build did not generate LiquidGlassShader.dxbc.' }

          $bytes = [System.IO.File]::ReadAllBytes($dxbc.FullName)
          if ($bytes.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'DXBC') {
            throw 'Debug LiquidGlassShader.dxbc is not a DXBC container.'
          }
          Write-Host "Generated Debug shader: $($dxbc.FullName) ($($dxbc.Length) bytes)"

      - name: Upload Debug build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-debug-build-log-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: core-x64-debug.log
