name: CsWinRT 3 quick restore

on:
  push:
    branches:
      - feat/aot-cswinrt3.0
    paths:
      - '.github/workflows/cswinrt3-restore.yml'
      - 'projection/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-projections:
    name: Restore CsWinRT 3 projections (Windows .1)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --list-sdks
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\\**\\Bin\\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found' }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore HLSL and LiquidGlass .1 projection projects
        shell: pwsh
        run: |
          foreach ($project in @('projection\\WinUI.Composition.Hlsl.Projection.csproj', 'projection\\WinUI.LiquidGlass.Projection.csproj')) {
            Write-Host "Restoring $project for CsWinRT 3"
            & $env:MSBUILD $project /t:Restore /p:TargetFramework=net10.0-windows10.0.26100.1 /p:Platform=x64 /p:NuGetAudit=false /v:minimal /nologo
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Validate resolved projection toolchain
        shell: pwsh
        run: |
          foreach ($name in @('WinUI.Composition.Hlsl.Projection', 'WinUI.LiquidGlass.Projection')) {
            $assets = "projection\\obj\\$name\\project.assets.json"
            if (!(Test-Path $assets)) { throw "Missing restore assets: $assets" }
            $json = Get-Content $assets -Raw | ConvertFrom-Json
            $keys = @($json.libraries.PSObject.Properties.Name)
            $matched = @($keys | Where-Object { $_ -match '^(Microsoft.Windows.CsWinRT|Microsoft.Windows.SDK.NET.Ref)/' })
            Write-Host "$name projection references: $($matched -join ', ')"
            if ($keys -notcontains 'Microsoft.Windows.CsWinRT/3.0.0-preview.261104.1') {
              throw "$name did not resolve CsWinRT 3.0.0-preview.261104.1"
            }
          }

  build-projections-x64:
    name: Build CsWinRT 3 reference projections (Release/x64)
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7
      - name: Resolve MSBuild and Windows SDK
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $msbuild = & $vswhere -latest -prerelease -requires Microsoft.Component.MSBuild -find 'MSBuild\\**\\Bin\\MSBuild.exe' | Select-Object -First 1
          if (!$msbuild) { throw 'Visual Studio MSBuild not found' }
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\\Windows Kits\\10\\Lib" -Directory |
            Where-Object { $_.Name -match '^10\\.0\\.\\d+\\.\\d+$' } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (!$sdk) { throw 'Windows SDK not found' }
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WIN_SDK=$($sdk.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build native x64 inputs
        shell: pwsh
        run: |
          & $env:MSBUILD 'src\\WinUI.LiquidGlass\\WinUI.LiquidGlass.vcxproj' /restore /t:Build /p:Configuration=Release /p:Platform=x64 /p:NuGetAudit=false "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build both CsWinRT 3 .1 reference projections
        shell: pwsh
        run: |
          foreach ($project in @('projection\\WinUI.Composition.Hlsl.Projection.csproj', 'projection\\WinUI.LiquidGlass.Projection.csproj')) {
            & $env:MSBUILD $project /restore /t:Build /p:TargetFramework=net10.0-windows10.0.26100.1 /p:Configuration=Release /p:Platform=x64 /p:BuildProjectReferences=false /p:NuGetAudit=false "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" /m /v:minimal /nologo
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Verify reference assemblies and forwarders
        shell: pwsh
        run: |
          foreach ($name in @('WinUI.Composition.Hlsl.Projection', 'WinUI.LiquidGlass.Projection')) {
            $dir = "projection\\bin\\x64\\Release\\net10.0-windows10.0.26100.1"
            foreach ($path in @("$dir\\$name.dll", "$dir\\ref\\$name.dll")) {
              if (!(Test-Path $path)) { throw "CsWinRT 3 asset missing: $path" }
              Write-Host "$path ($((Get-Item $path).Length) bytes)"
            }
          }
