name: Apply staged liquid glass patch

on:
  push:
    branches:
      - fix/liquid-glass-topology-blur-precompiled-hlsl
    paths:
      - .github/workflows/apply-liquid-glass-precompile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/liquid-glass-topology-blur-precompiled-hlsl
      - name: Update private runtime
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/WinUI.Composition.Hlsl/Runtime/CustomEffectRuntime.cpp')
          s = p.read_text(encoding='utf-8-sig')

          old = '''\tvoid EnsureShader(RuntimeEffectEntry* entry)\n\t{\n\t\t// Shader compilation is intentionally tied to the registered effect entry,'''
          new = '''\tvoid EnsureShader(RuntimeEffectEntry* entry)\n\t{\n\t\tauto const& definition = *entry->definition;\n\t\tif (definition.shaderBytecode && definition.shaderBytecodeSize)\n\t\t{\n\t\t\treturn;\n\t\t}\n\n\t\t// Shader compilation is intentionally tied to the registered effect entry,'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''\t\tbody->bytecodeSize = self->entry->shaderBlob->GetBufferSize();\n\t\tbody->bytecodeData = self->entry->shaderBlob->GetBufferPointer();'''
          new = '''\t\tif (definition.shaderBytecode && definition.shaderBytecodeSize)\n\t\t{\n\t\t\tbody->bytecodeSize = definition.shaderBytecodeSize;\n\t\t\tbody->bytecodeData = definition.shaderBytecode;\n\t\t}\n\t\telse\n\t\t{\n\t\t\tbody->bytecodeSize = self->entry->shaderBlob->GetBufferSize();\n\t\t\tbody->bytecodeData = self->entry->shaderBlob->GetBufferPointer();\n\t\t}'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''\tuint32_t GetCompiledSubgraphCount(CustomEffectRuntime::CustomEffectDefinition const& definition)\n\t{\n\t\t// slot 5 source flattening creates three FlattenedEffectGraph subgraphs:\n\t\t// source composite, the custom effect, then a final composite wrapper around\n\t\t// the custom effect. ICompiledEffect must expose the same count because\n\t\t// EffectInstance iterates the flattened subgraph vector when allocating\n\t\t// constant buffers.\n\t\treturn UsesFlattenSourceSubgraph(definition) ? 3u : 1u;\n\t}\n'''
          new = old + '''\n\tuint32_t GetExpectedEffectNodeCount(CustomEffectRuntime::CustomEffectDefinition const& definition)\n\t{\n\t\t// This is the observed FlattenedEffectGraph node shape for the supported\n\t\t// WinUI build. Keep it distinct from ICompiledEffect subgraph accounting:\n\t\t// EffectNode and CompiledEffectSubgraph are different private graph layers.\n\t\treturn UsesFlattenSourceSubgraph(definition) ? 3u : 1u;\n\t}\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''\t\t// v0.1 synthetic topology consists only of the custom node and its optional source-flatten wrapper.\n\t\tauto allowed=found->definition->flattenSourceBeforeCustomSampler ? 2u : 1u;\n\t\tif (nodeCount != allowed)'''
          new = '''\t\t// Do not take over an arbitrary mixed graph merely because it contains one\n\t\t// custom node. The synthetic compiler only knows the exact private topology\n\t\t// emitted for this definition; everything else must fail closed.\n\t\tauto const expectedNodeCount = GetExpectedEffectNodeCount(*found->definition);\n\t\tif (nodeCount != expectedNodeCount)'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text('\ufeff' + s, encoding='utf-8')
          PY
      - name: Remove staging files
        shell: bash
        run: git rm .github/patches/liquid-glass-precompile.patch .github/workflows/apply-liquid-glass-precompile.yml
      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "runtime: fix graph validation and consume precompiled DXBC"
          git push origin HEAD:fix/liquid-glass-topology-blur-precompiled-hlsl
