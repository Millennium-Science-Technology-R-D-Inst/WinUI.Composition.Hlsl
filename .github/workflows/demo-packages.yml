name: Build Demo Packages

on:
  workflow_call:
    inputs:
      package_version:
        description: Exact version of the validated NuGet packages.
        required: true
        type: string
      package_artifact:
        description: NuGet artifact from this workflow run; never rebuild native libraries here.
        required: true
        type: string
      msix_version:
        required: false
        type: string
        default: ''
      store:
        required: false
        type: boolean
        default: false
    secrets:
      PFX_CERT_BASE64:
        required: false
      PFX_PASSWORD:
        required: false
    outputs:
      version:
        value: ${{ jobs.build-and-package.outputs.version }}
      sideload_artifact:
        value: ${{ jobs.build-and-package.outputs.sideload_artifact }}
      store_artifact:
        value: ${{ jobs.build-and-package.outputs.store_artifact }}

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-2025-vs2026
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sideload_artifact: ${{ steps.meta.outputs.sideload_artifact }}
      store_artifact: ${{ steps.meta.outputs.store_artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check signing configuration
        id: signing
        shell: pwsh
        env:
          PFX_CERT_BASE64: ${{ secrets.PFX_CERT_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
          ALLOW_UNSIGNED: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) || github.actor == 'dependabot[bot]' }}
        run: |
          if ($env:PFX_CERT_BASE64 -and $env:PFX_PASSWORD) {
            'mode=Signed' >> $env:GITHUB_OUTPUT
          } elseif ($env:ALLOW_UNSIGNED -eq 'true' -and -not $env:PFX_CERT_BASE64 -and -not $env:PFX_PASSWORD) {
            'mode=Unsigned' >> $env:GITHUB_OUTPUT
            Write-Warning 'Organization signing secrets are unavailable to this PR. The Demo artifact will be explicitly marked unsigned.'
          } else {
            throw 'Both organization Actions secrets PFX_CERT_BASE64 and PFX_PASSWORD must be available to this repository.'
          }

      - name: Download validated NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.package_artifact }}
          path: artifacts/packages

      - name: Configure exact C++ package consumer
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: ./eng/Use-CIPackages.ps1 -PackageVersion $env:PACKAGE_VERSION -CppDemo

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Resolve Windows SDK tools
        shell: pwsh
        run: |
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdk = Get-ChildItem (Join-Path $sdkRoot 'Lib') -Directory |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (!$sdk) { throw 'No Windows SDK found on the runner.' }

          $bin = Join-Path $sdkRoot "bin\$($sdk.Name)\x64"
          $makeAppx = Join-Path $bin 'makeappx.exe'
          $signTool = Join-Path $bin 'signtool.exe'
          if (-not (Test-Path $makeAppx)) { throw "MakeAppx not found: $makeAppx" }
          if (-not (Test-Path $signTool)) { throw "SignTool not found: $signTool" }

          "WIN_SDK=$($sdk.Name)" >> $env:GITHUB_ENV
          "MAKEAPPX=$makeAppx" >> $env:GITHUB_ENV
          "SIGNTOOL=$signTool" >> $env:GITHUB_ENV
          Write-Host "Using Windows SDK $($sdk.Name)"

      - name: Generate package metadata
        id: meta
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.msix_version }}
          STORE_RELEASE: ${{ inputs.store }}
        run: |
          $versionArgs = @{
            Kind = 'Store'
            Version = $env:REQUESTED_VERSION
            RunNumber = [int]'${{ github.run_number }}'
            RunAttempt = [int]'${{ github.run_attempt }}'
          }
          $version = & ./eng/Get-PackageVersion.ps1 @versionArgs
          $kind = if ($env:STORE_RELEASE -eq 'true') { 'Store' } else { 'Preview' }
          "version=$version" >> $env:GITHUB_OUTPUT
          $artifact = "LiquidGlassDemo.${kind}_$version-attempt-${{ github.run_attempt }}"
          $suffix = if ('${{ steps.signing.outputs.mode }}' -eq 'Unsigned') { '-Unsigned' } else { '' }
          "sideload_artifact=$artifact-Sideload$suffix" >> $env:GITHUB_OUTPUT
          "store_artifact=$artifact-Store" >> $env:GITHUB_OUTPUT

      - name: Patch package manifest version
        shell: pwsh
        run: |
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'tests\Cpp\Package.appxmanifest'
          [xml]$manifest = Get-Content $manifestPath -Raw
          $manifest.Package.Identity.Version = '${{ steps.meta.outputs.version }}'
          $manifest.Save($manifestPath)

          [xml]$verify = Get-Content $manifestPath -Raw
          if ($verify.Package.Identity.Version -ne '${{ steps.meta.outputs.version }}') {
            throw "Manifest version patch failed: $($verify.Package.Identity.Version)"
          }
          Write-Host "Package version: $($verify.Package.Identity.Version)"

      - name: Validate Debug x64 C++ package consumer
        shell: pwsh
        run: |
          & msbuild 'tests\Cpp\WUILiquidGlassDemo.Hlsl.vcxproj' `
            /restore /t:Build /p:Configuration=Debug /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=false /p:NuGetAudit=false `
            "/p:RestoreConfigFile=$((Resolve-Path 'NuGet.CI.Config').Path)" `
            "/p:WindowsTargetPlatformVersion=$env:WIN_SDK" /m /v:minimal /nologo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build unsigned x64 and ARM64 MSIX packages
        shell: pwsh
        run: |
          foreach ($platform in @('x64', 'ARM64')) {
            $packageDir = "$env:GITHUB_WORKSPACE\artifacts\unsigned\$platform\"
            New-Item -ItemType Directory -Force $packageDir | Out-Null
            $args = @(
              'tests\Cpp\WUILiquidGlassDemo.Hlsl.vcxproj',
              '/restore',
              '/t:Build',
              '/p:Configuration=Release',
              "/p:Platform=$platform",
              '/p:PreferredToolArchitecture=x64',
              '/p:NuGetAudit=false',
              "/p:RestoreConfigFile=$((Resolve-Path 'NuGet.CI.Config').Path)",
              '/p:GenerateAppxPackageOnBuild=true',
              '/p:UapAppxPackageBuildMode=SideloadOnly',
              '/p:AppxBundle=Never',
              "/p:AppxPackageDir=$packageDir",
              '/p:AppxPackageSigningEnabled=false',
              '/p:GenerateTemporaryStoreCertificate=false',
              "/p:AppxPackageVersion=${{ steps.meta.outputs.version }}",
              "/p:WindowsTargetPlatformVersion=$env:WIN_SDK",
              '/m:1',
              '/v:minimal',
              '/nologo'
            )
            & msbuild @args
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }

            $pattern = "^WUILiquidGlassDemo\.Hlsl_.*_${platform}\.msix$"
            $packages = @(
              Get-ChildItem $packageDir -Recurse -File -Filter '*.msix' |
                Where-Object { $_.Name -match $pattern }
            )
            if ($packages.Count -ne 1) {
              Write-Host "MSIX files produced for ${platform}:"
              Get-ChildItem $packageDir -Recurse -File -Filter '*.msix' | Select-Object FullName, Length
              throw "Expected exactly one WUILiquidGlassDemo.Hlsl $platform MSIX, found $($packages.Count)."
            }
            Write-Host "$platform application package: $($packages[0].FullName)"
            & ./eng/Test-DemoPackage.ps1 -PackagePath $packages[0].FullName -Platform $platform -PackageVersion '${{ inputs.package_version }}'
          }

      - name: Create Store MSIX bundle and upload package
        if: inputs.store
        shell: pwsh
        run: |
          $unsignedRoot = "$env:GITHUB_WORKSPACE\artifacts\unsigned"
          $x64 = @(
            Get-ChildItem "$unsignedRoot\x64" -Recurse -File -Filter '*.msix' |
              Where-Object { $_.Name -match '^WUILiquidGlassDemo\.Hlsl_.*_x64\.msix$' }
          )
          $arm64 = @(
            Get-ChildItem "$unsignedRoot\ARM64" -Recurse -File -Filter '*.msix' |
              Where-Object { $_.Name -match '^WUILiquidGlassDemo\.Hlsl_.*_ARM64\.msix$' }
          )
          if ($x64.Count -ne 1 -or $arm64.Count -ne 1) {
            throw "Expected one x64 and one ARM64 application package; found x64=$($x64.Count), ARM64=$($arm64.Count)."
          }

          $storeDir = "$env:GITHUB_WORKSPACE\artifacts\store"
          $bundleDir = Join-Path $storeDir 'bundle'
          $uploadStaging = Join-Path $storeDir 'upload-staging'
          New-Item -ItemType Directory -Force $bundleDir, $uploadStaging | Out-Null

          $bundleName = "WUILiquidGlassDemo.Hlsl_${{ steps.meta.outputs.version }}_neutral.msixbundle"
          $bundlePath = Join-Path $bundleDir $bundleName
          $mapping = Join-Path $storeDir 'bundle-mapping.txt'
          @"
          [Files]
          "$($x64[0].FullName)" "WUILiquidGlassDemo.Hlsl_${{ steps.meta.outputs.version }}_x64.msix"
          "$($arm64[0].FullName)" "WUILiquidGlassDemo.Hlsl_${{ steps.meta.outputs.version }}_arm64.msix"
          "@ | Set-Content -Path $mapping -Encoding ascii

          & $env:MAKEAPPX bundle /v /o /bv '${{ steps.meta.outputs.version }}' /f $mapping /p $bundlePath
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path $bundlePath)) { throw "MakeAppx did not produce $bundlePath" }

          Copy-Item $bundlePath (Join-Path $uploadStaging $bundleName)
          $zipPath = Join-Path $storeDir "WUILiquidGlassDemo.Hlsl_${{ steps.meta.outputs.version }}.zip"
          $uploadPath = Join-Path $storeDir "WUILiquidGlassDemo.Hlsl_${{ steps.meta.outputs.version }}.msixupload"
          Compress-Archive -Path (Join-Path $uploadStaging '*') -DestinationPath $zipPath -CompressionLevel Optimal
          Move-Item $zipPath $uploadPath
          Write-Host "Store upload: $uploadPath"

      - name: Prepare and sign sideload packages with organization certificate
        shell: pwsh
        env:
          PFX_CERT_BASE64: ${{ secrets.PFX_CERT_BASE64 }}
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode }}
        run: ./eng/Sign-DemoPackages.ps1 -Unsigned:($env:SIGNING_MODE -eq 'Unsigned')

      - name: Verify Store outputs
        if: inputs.store
        shell: pwsh
        run: |
          $uploads = @(Get-ChildItem "$env:GITHUB_WORKSPACE/artifacts/store" -File -Filter '*.msixupload')
          $bundles = @(Get-ChildItem "$env:GITHUB_WORKSPACE/artifacts/store/bundle" -File -Filter '*.msixbundle')
          if ($uploads.Count -ne 1 -or $bundles.Count -ne 1) { throw 'Expected one Store upload and bundle.' }
          $upload = [IO.Compression.ZipFile]::OpenRead($uploads[0].FullName)
          try {
            if ($upload.Entries.Count -ne 1 -or $upload.Entries[0].Name -ne $bundles[0].Name) {
              throw 'Store upload must contain exactly the generated x64/ARM64 bundle.'
            }
          } finally { $upload.Dispose() }
          @"
          ## Liquid Glass Demo Store release
          - Version: ${{ steps.meta.outputs.version }}
          - Upload the .msixupload to Partner Center. It already contains the x64/ARM64 .msixbundle.
          - Microsoft Store signs it after submission. The bundle is not a second submission.
          - Source: ${{ github.sha }}
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Verify sideload outputs
        shell: pwsh
        run: |
          $msix = @(
            Get-ChildItem "$env:GITHUB_WORKSPACE/artifacts/sideload" -Recurse -File -Filter '*.msix' |
              Where-Object { $_.Name -match '^WUILiquidGlassDemo\.Hlsl_.*_(x64|ARM64)\.msix$' }
          )
          if ($msix.Count -ne 2) { throw 'Expected x64 and ARM64 sideload packages.' }
          if ('${{ steps.signing.outputs.mode }}' -eq 'Signed' -and
              !(Test-Path 'artifacts/certificate/LiquidGlassDemo.cer')) {
            throw 'The organization public certificate was not exported.'
          }
          @"
          ## Liquid Glass Demo sideload packages
          - Version: ${{ steps.meta.outputs.version }}
          - Signing: ${{ steps.signing.outputs.mode }}. See INSTALL.txt in the artifact.
          - Signed packages include LiquidGlassDemo.cer exported from the organization certificate.
          - Download: ${{ steps.meta.outputs.sideload_artifact }}
          - Source: ${{ github.sha }}
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Remove private signing key
        if: always()
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:RUNNER_TEMP 'liquidglass-demo-signing') -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload Store package
        if: inputs.store
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.store_artifact }}
          path: |
            artifacts/store/*.msixupload
          if-no-files-found: error
          retention-days: 30

      - name: Upload sideload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.sideload_artifact }}
          path: |
            artifacts/sideload/**/*.msix
            artifacts/sideload/INSTALL.txt
            artifacts/certificate/*.cer
          if-no-files-found: error
          retention-days: 30
